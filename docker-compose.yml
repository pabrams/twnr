services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: twnr
      POSTGRES_USER: twnr_user
      POSTGRES_PASSWORD: twnr_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twnr_user -d twnr"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
