<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWNR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; color: #c0c0c0; font-family: 'Courier New', Courier, monospace; }
    #terminal { width: 100%; height: 100%; display: none; }
    #auth {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 12px;
    }
    #auth h1 { color: #c0c0c0; margin-bottom: 8px; }
    #auth input {
      background: #111; color: #c0c0c0; border: 1px solid #444; padding: 8px 12px;
      font-family: inherit; font-size: 14px; width: 260px;
    }
    #auth button {
      background: #333; color: #c0c0c0; border: 1px solid #555; padding: 8px 16px;
      font-family: inherit; font-size: 14px; cursor: pointer; width: 260px;
    }
    #auth button:hover { background: #444; }
    #auth .toggle { background: none; border: none; color: #888; font-size: 12px; cursor: pointer; }
    #auth .toggle:hover { color: #c0c0c0; }
    #auth .error { color: #f44; font-size: 13px; min-height: 1em; }
    #universe-select {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 12px;
    }
    #universe-select h1 { color: #c0c0c0; margin-bottom: 8px; }
    #universe-list { list-style: none; width: 300px; }
    #universe-list li {
      background: #111; border: 1px solid #444; padding: 10px 14px; margin-bottom: 6px;
      cursor: pointer; font-family: inherit; font-size: 14px; color: #c0c0c0;
    }
    #universe-list li:hover { background: #222; border-color: #666; }
    #universe-list li .player-status { color: #888; font-size: 12px; }
    #universe-select .error { color: #f44; font-size: 13px; min-height: 1em; }
    #admin-btn {
      background: none; border: none; color: #888; font-size: 12px; cursor: pointer;
    }
    #admin-btn:hover { color: #c0c0c0; }
    #admin {
        display: none; flex-direction: column; align-items: center;
        height: 100%; width: 100%; padding: 20px; overflow-y: auto;
    }
    #admin .admin-nav {
        display: flex; gap: 8px; margin-bottom: 16px;
    }
    #admin .admin-nav button {
        background: #222; color: #c0c0c0; border: 1px solid #444; padding: 6px 14px;
        font-family: inherit; font-size: 13px; cursor: pointer;
    }
    #admin .admin-nav button:hover, #admin .admin-nav button.active {
        background: #444; border-color: #666;
    }
    #admin .admin-content {
        width: 100%; max-width: 800px;
    }
    #admin h2 { color: #0ff; margin-bottom: 12px; font-size: 16px; }
    #admin h3 { color: #c0c0c0; margin: 12px 0 8px; font-size: 14px; }
    #admin table {
        width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px;
    }
    #admin table th {
        text-align: left; color: #0ff; border-bottom: 1px solid #444; padding: 4px 8px;
    }
    #admin table td {
        padding: 4px 8px; border-bottom: 1px solid #222; color: #c0c0c0;
    }
    #admin .stat-label { color: #888; }
    #admin .stat-value { color: #0ff; }
    #admin input, #admin select {
        background: #111; color: #c0c0c0; border: 1px solid #444; padding: 6px 10px;
        font-family: inherit; font-size: 13px;
    }
    #admin button {
        background: #333; color: #c0c0c0; border: 1px solid #555; padding: 6px 14px;
        font-family: inherit; font-size: 13px; cursor: pointer;
    }
    #admin button:hover { background: #444; }
    #admin button.danger { border-color: #a00; }
    #admin button.danger:hover { background: #400; }
    #admin .error { color: #f44; font-size: 13px; margin-top: 4px; }
    #admin .success { color: #0f0; font-size: 13px; margin-top: 4px; }
    #admin .form-row { margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
    #admin .form-row label { color: #888; min-width: 100px; font-size: 13px; }
    #admin .actions { display: flex; gap: 6px; }
    #player-name-prompt {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 12px;
    }
    #player-name-prompt h1 { color: #c0c0c0; margin-bottom: 8px; }
    #player-name-prompt input {
      background: #111; color: #c0c0c0; border: 1px solid #444; padding: 8px 12px;
      font-family: inherit; font-size: 14px; width: 260px;
    }
    #player-name-prompt button {
      background: #333; color: #c0c0c0; border: 1px solid #555; padding: 8px 16px;
      font-family: inherit; font-size: 14px; cursor: pointer; width: 260px;
    }
    #player-name-prompt button:hover { background: #444; }
    #player-name-prompt .error { color: #f44; font-size: 13px; min-height: 1em; }
  </style>
</head>
<body>
  <div id="auth">
    <h1>TWNR</h1>
    <input id="auth-name" type="text" placeholder="Name" />
    <input id="auth-email" type="text" placeholder="Email" />
    <input id="auth-password" type="password" placeholder="Password" />
    <div class="error" id="auth-error"></div>
    <button id="auth-submit">Register</button>
    <button class="toggle" id="auth-toggle">Already have an account? Log in</button>
  </div>
  <div id="universe-select">
    <h1>Select Universe</h1>
    <ul id="universe-list"></ul>
    <div class="error" id="universe-error"></div>
    <button id="admin-btn" style="display:none;">Admin Panel</button>
  </div>
  <div id="admin"></div>
  <div id="player-name-prompt">
    <h1>New Player</h1>
    <p style="color:#888; font-size:13px;">Enter a name for your character in this universe:</p>
    <input id="player-name-input" type="text" placeholder="Player name" />
    <div class="error" id="player-name-error"></div>
    <button id="player-name-submit">Join Universe</button>
  </div>
  <div id="terminal"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
